server:
  port: ${SERVER_PORT:8084}

reed-api:
  base-url: ${REED_API_BASE_URL:https://www.reed.co.uk/api/1.0}
  key: ${REED_API_KEY}
  search-path: /search
  connect-timeout: ${REED_API_CONNECT_TIMEOUT:5000}
  read-timeout: ${REED_API_READ_TIMEOUT:10000}

job-search:
  default-distance: 25
  default-page: 1
  default-page-size: 20
  max-page-size: 100
  max-distance: 100
